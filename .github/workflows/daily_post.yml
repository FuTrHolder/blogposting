name: 미국 증시 블로그 원고 대시보드 업로드

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "포스팅 모드 (morning=전일 마감리뷰 / evening=프리마켓&이슈)"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  morning-post:
    name: "📊 오전 포스팅 (전일 마감 리뷰)"
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.post_mode == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔤 한글 폰트 설치 (썸네일 제목 오버레이용)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: 📦 기본 패키지 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🥣 BeautifulSoup 설치 및 import 검증
        run: |
          python -m pip install --upgrade beautifulsoup4

          python - <<'PY'
          import sys

          try:
              import bs4
              from bs4 import BeautifulSoup

              print(f"Python: {sys.version}")
              print(f"BeautifulSoup4: {bs4.__version__}")

              html = "<html><body><p>BeautifulSoup verification</p></body></html>"
              soup = BeautifulSoup(html, "html.parser")

              assert soup.p.text == "BeautifulSoup verification"

              print("BeautifulSoup import: OK")
              print("BeautifulSoup parser: OK")
          except Exception as exc:
              print(f"BeautifulSoup verification failed: {exc}")
              raise
          PY

      - name: 📁 디렉토리 준비
        run: |
          mkdir -p images

      - name: 🔎 애플리케이션 의존성 최종 검증
        run: |
          python - <<'PY'
          import bs4
          from bs4 import BeautifulSoup

          print("Dependency verification completed.")
          print(f"bs4 version: {bs4.__version__}")
          print(f"BeautifulSoup: {BeautifulSoup}")
          PY

      - name: 🌅 오전 원고 생성 및 대시보드 업로드
        env:
          POST_MODE: morning
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

          # ── 썸네일 AI 이미지 생성 ──
          # 1순위: Cloudflare Workers AI
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          # 2순위: HuggingFace
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}

          # 이미지 검색 fallback
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          # 대시보드
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

          # GitHub Release
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

  evening-post:
    name: "🌙 저녁 포스팅 (프리마켓 & 당일 이슈)"
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.post_mode == 'evening')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔤 한글 폰트 설치 (썸네일 제목 오버레이용)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: 📦 기본 패키지 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🥣 BeautifulSoup 설치 및 import 검증
        run: |
          python -m pip install --upgrade beautifulsoup4

          python - <<'PY'
          import sys

          try:
              import bs4
              from bs4 import BeautifulSoup

              print(f"Python: {sys.version}")
              print(f"BeautifulSoup4: {bs4.__version__}")

              html = "<html><body><p>BeautifulSoup verification</p></body></html>"
              soup = BeautifulSoup(html, "html.parser")

              assert soup.p.text == "BeautifulSoup verification"

              print("BeautifulSoup import: OK")
              print("BeautifulSoup parser: OK")
          except Exception as exc:
              print(f"BeautifulSoup verification failed: {exc}")
              raise
          PY

      - name: 📁 디렉토리 준비
        run: |
          mkdir -p images

      - name: 🔎 애플리케이션 의존성 최종 검증
        run: |
          python - <<'PY'
          import bs4
          from bs4 import BeautifulSoup

          print("Dependency verification completed.")
          print(f"bs4 version: {bs4.__version__}")
          print(f"BeautifulSoup: {BeautifulSoup}")
          PY

      - name: 🌙 저녁 원고 생성 및 대시보드 업로드
        env:
          POST_MODE: evening
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

          # ── 썸네일 AI 이미지 생성 ──
          # 1순위: Cloudflare Workers AI
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          # 2순위: HuggingFace
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}

          # 이미지 검색 fallback
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          # 대시보드
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

          # GitHub Release
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py