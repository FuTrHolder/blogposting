name: 미국 증시 블로그 원고 대시보드 업로드

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "포스팅 모드 (morning=전일 마감리뷰 / evening=프리마켓&이슈)"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening

# 같은 모드(morning/evening)의 실행이 겹치면 뒤 실행은 앞 실행이 끝날 때까지 대기합니다.
# (진행 상황·결과물이 서로 뒤섞이거나 취소 보고가 새 실행을 덮어쓰는 경합 방지)
concurrency:
  group: blog-post-${{ github.event.inputs.post_mode || 'morning' }}
  cancel-in-progress: false

jobs:
  morning-post:
    name: "📊 오전 포스팅 (전일 마감 리뷰)"
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.post_mode == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📡 대시보드에 원고 작성 시작 알림 (탭 생성)
        if: always()
        continue-on-error: true
        env:
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          POST_MODE: morning
        run: |
          # 의존성 설치 전에 실행되므로 curl + jq만 사용합니다. 실패해도 본 작업은 계속됩니다.
          if [ -z "$DASHBOARD_API_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "DASHBOARD_API_URL/INGEST_SECRET 미설정 — 시작 알림 건너뜀"; exit 0
          fi
          POST_DATE="$(TZ=Asia/Seoul date +%F)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg d "$POST_DATE" --arg m "$POST_MODE" --arg u "$RUN_URL" \
            '{post_date:$d, mode:$m, step:0, status:"running", message:"GitHub Actions 실행 시작", run_url:$u}' \
          | curl -sS -m 20 -X POST "${DASHBOARD_API_URL%/}/api/ingest/blog-progress" \
              -H "Content-Type: application/json" \
              -H "X-Ingest-Secret: ${INGEST_SECRET}" \
              --data-binary @- >/dev/null \
            || echo "시작 알림 실패 (무시)"

      - name: 📥 코드 체크아웃
        id: s_checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        id: s_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔤 한글 폰트 설치 (썸네일 제목 오버레이용)
        id: s_fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: 📦 기본 패키지 설치
        id: s_deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🥣 BeautifulSoup 설치 및 import 검증
        id: s_bs4
        run: |
          python -m pip install --upgrade beautifulsoup4

          python - <<'PY'
          import sys

          try:
              import bs4
              from bs4 import BeautifulSoup

              print(f"Python: {sys.version}")
              print(f"BeautifulSoup4: {bs4.__version__}")

              html = "<html><body><p>BeautifulSoup verification</p></body></html>"
              soup = BeautifulSoup(html, "html.parser")

              assert soup.p.text == "BeautifulSoup verification"

              print("BeautifulSoup import: OK")
              print("BeautifulSoup parser: OK")
          except Exception as exc:
              print(f"BeautifulSoup verification failed: {exc}")
              raise
          PY

      - name: 📁 디렉토리 준비
        id: s_dirs
        run: |
          mkdir -p images

      - name: 🔎 애플리케이션 의존성 최종 검증
        id: s_verify
        run: |
          python - <<'PY'
          import bs4
          from bs4 import BeautifulSoup

          print("Dependency verification completed.")
          print(f"bs4 version: {bs4.__version__}")
          print(f"BeautifulSoup: {BeautifulSoup}")
          PY

      - name: 🌅 오전 원고 생성 및 대시보드 업로드
        id: s_run
        env:
          POST_MODE: morning
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

          # ── 썸네일 AI 이미지 생성 ──
          # 1순위: Cloudflare Workers AI
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          # 2순위: HuggingFace
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}

          # 이미지 검색 fallback
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          # 대시보드
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

          # GitHub Release
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: 🚨 실패 지점을 대시보드에 기록
        if: failure() || cancelled()
        continue-on-error: true
        env:
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          POST_MODE: morning
          O_CHECKOUT: ${{ steps.s_checkout.outcome }}
          O_PYTHON: ${{ steps.s_python.outcome }}
          O_FONTS: ${{ steps.s_fonts.outcome }}
          O_DEPS: ${{ steps.s_deps.outcome }}
          O_BS4: ${{ steps.s_bs4.outcome }}
          O_DIRS: ${{ steps.s_dirs.outcome }}
          O_VERIFY: ${{ steps.s_verify.outcome }}
          O_RUN: ${{ steps.s_run.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DASHBOARD_API_URL" ] || [ -z "$INGEST_SECRET" ]; then exit 0; fi

          FAILED="알 수 없는 단계"
          for pair in \
            "코드 체크아웃:$O_CHECKOUT" "Python 설정:$O_PYTHON" "한글 폰트 설치:$O_FONTS" \
            "패키지 설치(requirements.txt):$O_DEPS" "BeautifulSoup 검증:$O_BS4" \
            "디렉토리 준비:$O_DIRS" "의존성 최종 검증:$O_VERIFY" "원고 생성(main.py):$O_RUN"; do
            case "$pair" in *:failure|*:cancelled) FAILED="${pair%:*}"; break;; esac
          done

          REASON="단계 실패"
          if [ "$JOB_STATUS" = "cancelled" ]; then
            REASON="실행 취소 또는 시간 초과(timeout-minutes: 15분)로 중단"
          fi

          POST_DATE="$(TZ=Asia/Seoul date +%F)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          LOG="GitHub Actions 중단 사유: ${REASON}
          중단된 단계: '${FAILED}' (job 상태: ${JOB_STATUS})
          main.py가 이미 상세 로그를 남겼다면 위 로그가 우선 표시됩니다.
          그 외의 경우(패키지 설치 실패, 타임아웃 등)는 아래 '실행 보기' 링크의 단계별 로그를 확인하세요."

          jq -n --arg d "$POST_DATE" --arg m "$POST_MODE" --arg u "$RUN_URL" \
                --arg s "$FAILED" --arg l "$LOG" \
            '{post_date:$d, mode:$m, step:-1, status:"failed",
              message:("GitHub Actions 중단: " + $s), error_step:$s, error_log:$l,
              run_url:$u, keep_existing_error:true}' \
          | curl -sS -m 20 -X POST "${DASHBOARD_API_URL%/}/api/ingest/blog-progress" \
              -H "Content-Type: application/json" \
              -H "X-Ingest-Secret: ${INGEST_SECRET}" \
              --data-binary @- >/dev/null \
            || echo "실패 기록 전송 실패 (무시)"

  evening-post:
    name: "🌙 저녁 포스팅 (프리마켓 & 당일 이슈)"
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.post_mode == 'evening')
