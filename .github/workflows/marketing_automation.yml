name: 📣 마케팅 자동화 (SNS 자동 업로드)

on:
  workflow_run:
    workflows: ["미국 증시 블로그 원고 이메일 발송"]
    types: [completed]
    branches: [main]

  schedule:
    - cron: "*/30 * * * *"

  # 대시보드의 "마케팅 워크플로우 실행" 버튼이 이 이벤트를 트리거합니다.
  # (Cloudflare Worker → GitHub repository_dispatch API 호출)
  repository_dispatch:
    types: [dashboard-marketing-trigger]

  workflow_dispatch:
    inputs:
      force_crawl:
        description: "강제 재실행 (이미 처리된 글도 다시 실행, true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  marketing:
    name: "📣 SNS 자동 업로드"
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🎬 FFmpeg + 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          echo "✅ Noto Sans CJK 폰트 확인:"
          fc-list :lang=ko | head -3

      - name: 📦 패키지 설치
        run: pip install -r marketing/requirements.txt

      - name: 📁 디렉토리 준비
        run: mkdir -p marketing/videos marketing/images marketing/fonts

      - name: 📣 마케팅 자동화 실행
        working-directory: marketing
        env:
          # ── Gist 상태 관리 ────────────────────────────────────────────
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}

          # ── 강제 재실행 ───────────────────────────────────────────────
          FORCE_CRAWL: ${{ github.event.inputs.force_crawl || 'false' }}

          # ── AI 콘텐츠 생성 ───────────────────────────────────────────
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}

          # ── 이미지 소스 (무료 API) ────────────────────────────────────
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Unsplash Source는 API 키 불필요 (자동 사용)

          # ── YouTube ──────────────────────────────────────────────────
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          # ── Facebook ─────────────────────────────────────────────────
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

          # ── Instagram ────────────────────────────────────────────────
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_VIDEO_URL: ${{ secrets.INSTAGRAM_VIDEO_URL }}
          INSTAGRAM_IMAGE_URL: ${{ secrets.INSTAGRAM_IMAGE_URL }}

          # ── Threads ──────────────────────────────────────────────────
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # THREADS_IMAGE_URL: Threads 이미지 포함 게시 시 공개 URL 필요
          # (INSTAGRAM_IMAGE_URL을 공유하거나 별도 설정)
          THREADS_IMAGE_URL: ${{ secrets.THREADS_IMAGE_URL }}

          # ── 카카오 메일 발송 (카카오 텍스트 + 썸네일 + 영상) ──────────
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

          # ── Cloudflare 대시보드 업로드 (미설정 시 자동 스킵) ─────────────
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          # GitHub Release에 썸네일/영상 업로드 시 사용 (별도 발급 불필요, Actions 자동 제공)
          # 주의: 위 GITHUB_TOKEN은 이미 Gist 접근용(GH_PAT)으로 쓰이고 있어 이름을 분리했습니다.
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # X(Twitter) 완전 제거됨

        run: python main_marketing.py

      - name: 📎 생성 파일 아티팩트 저장
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-outputs-${{ github.run_id }}
          path: |
            marketing/videos/*.mp4
            marketing/images/*.jpg
            marketing/images/*.png
          retention-days: 7
          if-no-files-found: ignore
