name: 🚀 대시보드 배포 (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🗄️ D1 스키마 적용 (IF NOT EXISTS 기반이라 반복 실행해도 안전)
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest d1 execute blogposting-db --remote --file=./schema.sql

      - name: 🚀 Cloudflare Pages 배포
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy public --project-name=blogposting-dashboard
