<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seedsup 블로그 대시보드</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>seedsup.tistory.com 콘텐츠 대시보드</h1>
  </header>

  <nav id="tabs"></nav>

  <main id="app">
    <section id="content-panel" class="panel">
      <div class="panel-head">
        <h2 id="post-title">포스트를 선택하세요</h2>
      </div>
      <div class="content-body">
        <div class="field">
          <div class="field-head">
            <span>썸네일</span>
            <span class="btn-group">
              <button class="copy-btn" id="thumb-copy-btn">이미지 복사</button>
              <a class="copy-btn" id="thumb-download-link" download>다운로드</a>
            </span>
          </div>
          <img id="thumb-img" alt="썸네일" hidden>
          <p id="thumb-empty" class="muted">썸네일 없음</p>
        </div>
        <div class="field">
          <div class="field-head">
            <span>제목</span>
            <button class="copy-btn" data-target="title-text">복사</button>
          </div>
          <textarea id="title-text" rows="2" readonly></textarea>
        </div>
        <div class="field">
          <div class="field-head">
            <span>본문 (마크다운)</span>
            <button class="copy-btn" data-target="content-text">복사</button>
          </div>
          <textarea id="content-text" rows="16" readonly></textarea>
        </div>
        <div class="field">
          <div class="field-head">
            <span>태그</span>
            <button class="copy-btn" data-target="tags-text">복사</button>
          </div>
          <textarea id="tags-text" rows="1" readonly></textarea>
        </div>
      </div>
    </section>

    <section id="marketing-panel" class="panel">
      <div class="panel-head">
        <h2>마케팅 워크플로우</h2>
        <button id="trigger-btn">마케팅 워크플로우 실행</button>
      </div>
      <p id="trigger-status" class="muted"></p>
      <div id="marketing-grid"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
