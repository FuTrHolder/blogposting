name = "blogposting-dashboard"
pages_build_output_dir = "public"
compatibility_date = "2026-07-01"

# 1) 아래 database_id는 cloudflare_setup.yml 워크플로우를 최초 1회 실행한 뒤
#    출력 로그에서 확인해 그대로 교체하세요.
[[d1_databases]]
binding = "DB"
database_name = "blogposting-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 2) R2 버킷은 이름만 있으면 되므로 별도 ID 교체가 필요 없습니다.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "blogposting-assets"
